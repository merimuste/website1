<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-content">
                <h1 class="name">Your Name</h1>
                <p class="tagline">Creating moments of beauty</p>
            </div>
        </section>

        <!-- Image Section -->
        <section class="image-section">
            <div class="image-container">
                <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1200&h=800&fit=crop" alt="Serene landscape" class="hero-image">
            </div>
        </section>

        <!-- About Section -->
        <section class="about">
            <div class="content-wrapper">
                <p class="intro-text">
                    Welcome to my corner of the world.
                    A space for creativity, growth, and connection.
                </p>
            </div>
        </section>

        <!-- Second Image Section -->
        <section class="image-section">
            <div class="image-container">
                <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1200&h=800&fit=crop" alt="Mountain vista" class="hero-image">
            </div>
        </section>

        <!-- Links Section (Link Tree Style) -->
        <section class="links">
            <div class="content-wrapper">
                <h2 class="section-title">Connect & Explore</h2>
                <div class="link-tree">
                    <a href="#" class="link-item">
                        <span class="link-text">Portfolio</span>
                    </a>
                    <a href="#" class="link-item">
                        <span class="link-text">Instagram</span>
                    </a>
                    <a href="#" class="link-item">
                        <span class="link-text">LinkedIn</span>
                    </a>
                    <a href="#" class="link-item">
                        <span class="link-text">Email</span>
                    </a>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer>
            <p>&copy; 2026. All rights reserved.</p>
        </footer>
    </main>
</body>
</html>
